name: VLNK Windows with VDI targets
on:
  push:
    branches: [ventoy-esp]
    paths: ['Vlnk/**', '.github/workflows/vlnk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release Win32 (runs on x64 Windows too)
        shell: pwsh
        run: |
          msbuild Vlnk/vs/VentoyVlnk/VentoyVlnk.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /bl:vlnk-build.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem Vlnk/vs -Recurse -Filter VentoyVlnk.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (!$exe) { throw 'Release executable missing' }
          Copy-Item $exe.FullName dist/VentoyVlnk.exe
          Get-FileHash dist/VentoyVlnk.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
          git rev-parse HEAD | Out-File dist/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VentoyVlnk-VDI-Windows
          path: |
            dist/
            vlnk-build.binlog
          if-no-files-found: error
