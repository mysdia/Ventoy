name: Local ESP x86_64 UEFI
on:
  push:
    branches: [ventoy-esp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GRUB build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake autopoint gettext libtool bison flex python3 libfreetype6-dev liblzma-dev texinfo pkg-config qemu-system-x86 ovmf dosfstools mtools gdisk ntfs-3g grub-efi-amd64-bin tesseract-ocr python3-pil
      - name: Compile patched GRUB and package local ESP runtime
        run: |
          set -o pipefail
          bash tools/build-local-esp.sh 2>&1 | tee local-esp-build.log
      - name: QEMU OVMF smoke test (ESP partition 1 and 3)
        run: bash test/qemu-esp/smoke.sh
      - name: Explicit EFI Ventoy path and graphical menu capture
        run: bash test/qemu-esp/gui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ventoy-local-esp-x86_64
          path: |
            ventoy-local-esp-x86_64.tar.gz
            local-esp*.log
            local-esp*.txt
            local-esp.sha256
            test-results/
          if-no-files-found: error
