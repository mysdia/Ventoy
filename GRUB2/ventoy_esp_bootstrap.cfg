# Local ESP mode is x86_64 UEFI only. Prefer the loaded image filesystem.
set vtoy_boot_device=$root
if regexp --set=1:vtoy_boot_device '^\(([^)]*)\)' "$cmdpath"; then
    true
fi
set vtoy_runtime_prefix=/ventoy-local
if [ -f ($vtoy_boot_device)/ventoy-local/ventoy/ventoy.esp.marker ]; then
    set vtoy_runtime_dev=$vtoy_boot_device
else
    search --no-floppy --file --set=vtoy_runtime_dev /ventoy-local/ventoy/ventoy.esp.marker
fi
if [ -n "$vtoy_runtime_dev" ]; then
    if [ -f ($vtoy_runtime_dev)/ventoy-local/ventoy/ventoy.cpio -a -f ($vtoy_runtime_dev)/ventoy-local/grub/grub.cfg -a -f ($vtoy_runtime_dev)/ventoy-local/grub/localboot.cfg ]; then
        set root=$vtoy_runtime_dev
        set prefix=($vtoy_runtime_dev)/ventoy-local/grub
        set vtoy_esp_mode=1
        export vtoy_esp_mode
        export vtoy_runtime_dev
        export vtoy_runtime_prefix
        echo "[Ventoy-ESP] boot device: $vtoy_boot_device"
        echo "[Ventoy-ESP] runtime device: $vtoy_runtime_dev"
        echo "[Ventoy-ESP] runtime prefix: $vtoy_runtime_prefix"
        echo "[Ventoy-ESP] ventoy.cpio: ($vtoy_runtime_dev)$vtoy_runtime_prefix/ventoy/ventoy.cpio"
        echo "[Ventoy-ESP] grub prefix: $prefix"
    fi
fi
if [ "$vtoy_esp_mode" != "1" ]; then
    echo "[Ventoy-ESP] Missing /ventoy-local runtime. Installation is incomplete."
    halt
fi
configfile $prefix/grub.cfg
